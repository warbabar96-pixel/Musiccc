<!DOCTYPE html>
<html lang="en">

<style>
:root{
  --bg:#08090d;--cream:#fff1dc;--orange:#ff5528;--red:#9e230e;
  --muted:rgba(255,241,220,.5);--ext:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--cream);overflow:hidden}
body{font-family:Manrope,system-ui,sans-serif}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:
  radial-gradient(ellipse at 50% 48%,rgba(255,83,35,.11),transparent 38%),
  linear-gradient(180deg,rgba(5,6,9,.24),rgba(5,6,9,.3) 45%,rgba(5,6,9,.8))}
.grain{position:fixed;inset:-50%;z-index:2;pointer-events:none;opacity:.065;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
  animation:grain .22s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(-2%,-1%)}}
#view{position:fixed;inset:0;z-index:3;perspective:1200px;overflow:hidden}
#stage{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:filter .5s}
.line{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;
  gap:.08em .28em;padding:0 6vw 3vh;text-align:center;font-family:"Archivo Black",Impact,sans-serif;
  font-size:clamp(34px,9.3vw,100px);line-height:1.16;letter-spacing:-.045em;transform-style:preserve-3d}
.w{position:relative;display:inline-block;opacity:0;color:var(--cream);
  -webkit-text-stroke:.5px rgba(255,255,255,.12);
  text-shadow:1px 1px 0 #ff9a63,2px 2px 0 #e85a2b,3px 3px 0 #c43c19,4px 4px 0 #a32c11,
  5px 5px 0 #76200f,7px 8px 0 rgba(0,0,0,.65),0 0 28px rgba(255,79,31,.2);
  transform:translate3d(0,70px,-650px) rotateX(42deg) rotateY(var(--ry)) scale(.72);
  filter:blur(5px);
  transition:transform .85s cubic-bezier(.16,1,.3,1),opacity .45s ease,filter .65s ease;
  transition-delay:calc(var(--i)*65ms)}
.line.in .w{opacity:1;transform:translate3d(0,0,0) rotateX(0) rotateY(0) scale(1);filter:blur(0)}
.line.out .w{opacity:0;transform:translate3d(0,-90px,360px) rotateX(-30deg) scale(1.12);filter:blur(4px);transition:.42s;transition-delay:0s}
.topbar{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top,0px)) 20px 14px;pointer-events:none}
.brand{font:12px Manrope,sans-serif;font-weight:800;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,241,220,.72)}
.brand b{color:var(--orange)}
.pill{border:1px solid rgba(255,241,220,.18);background:rgba(12,12,15,.45);backdrop-filter:blur(14px);
  border-radius:999px;padding:8px 12px;color:rgba(255,241,220,.72);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.bottom{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));
  pointer-events:none;background:linear-gradient(0deg,rgba(5,6,9,.72),transparent)}
.track{height:2px;background:rgba(255,241,220,.17);overflow:hidden;border-radius:4px;margin:0 auto 12px;max-width:680px}
#progress{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ffc18b);box-shadow:0 0 14px var(--orange)}
.caption{display:flex;align-items:center;justify-content:space-between;max-width:680px;margin:auto;color:var(--muted);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase}
#time{font-variant-numeric:tabular-nums}
#yt{position:fixed;left:0;top:0;width:200px;height:200px;opacity:.01;pointer-events:none;z-index:-1}
.panel{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(ellipse at 50% 38%,#24120f 0%,#0b0b0e 50%,#07080b 100%);
  padding:calc(24px + env(safe-area-inset-top,0px)) 6vw calc(24px + env(safe-area-inset-bottom,0px))}
.panel.hide{display:none}
.eyebrow{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--orange);font-weight:800}
.panel h1{margin:0;text-align:center;font:clamp(48px,14vw,100px)/.95 "Archivo Black",Impact,sans-serif;letter-spacing:-.06em;
  color:var(--cream);text-shadow:3px 3px 0 #d84b22,6px 6px 0 #77200e,0 0 55px rgba(255,83,35,.24)}
.sub{max-width:340px;text-align:center;line-height:1.7;font-size:13px;color:rgba(255,241,220,.58)}
button{font:800 13px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(135deg,#ff7544,#e33a17);
  color:white;border:1px solid rgba(255,255,255,.16);padding:15px 24px;border-radius:999px;box-shadow:0 10px 32px rgba(255,69,25,.22);cursor:pointer}
button:active{transform:scale(.97)}
button.alt{background:rgba(255,255,255,.06);color:var(--cream);border:1px solid rgba(255,241,220,.18);box-shadow:none}
textarea{width:100%;max-width:560px;height:38vh;background:#121216;color:var(--cream);border:1px solid rgba(255,241,220,.18);border-radius:14px;
  padding:14px;font:14px/1.6 ui-monospace,monospace;outline:none}
textarea:focus{border-color:var(--orange)}
#cur{font:clamp(28px,8vw,64px)/1.2 "Archivo Black",Impact,sans-serif;text-align:center;min-height:2.6em}
#nxt{opacity:.55;font:12px Manrope,sans-serif;text-align:center}
#tapBtn{width:100%;max-width:560px;height:22vh;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.corner{position:fixed;z-index:4;left:20px;top:50%;width:5px;height:70px;transform:translateY(-50%);
  background:linear-gradient(180deg,transparent,var(--orange),transparent);opacity:.75}
@media(min-width:700px){.line{font-size:clamp(60px,7vw,112px);padding-left:14vw;padding-right:14vw}.bottom{padding-bottom:28px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas><div class="shade"></div><div class="grain"></div>
<div class="topbar"><div class="brand">WAR<b>TECH</b> / VISUALS</div><div class="pill">Now playing · Safar</div></div>
<div class="corner"></div>
<div id="view"><div id="stage"></div></div>
<div class="bottom"><div class="track"><div id="progress"></div></div><div class="caption"><span>SAFAR · LYRIC EXPERIENCE</span><span id="time">00:00</span></div></div>
<div id="yt"><div id="player"></div></div>

<div class="panel" id="go">
  <div class="eyebrow">A cinematic lyric experience</div><h1 id="title">SAFAR</h1>
  <div class="sub">A journey through words, light, and motion.<br>Put on your headphones and press play.</div>
  <div class="row"><button id="start">▶ &nbsp; Enter the journey</button><button class="alt" id="sync">Set timings</button></div>
</div>
<div class="panel hide" id="ed"><div class="eyebrow">Timing studio</div><h1 style="font-size:30px">Paste lyrics</h1>
  <textarea id="txt" placeholder="One lyric line per row"></textarea>
  <div class="row"><button id="edGo">Start tapping</button><button class="alt" id="edBack">Back</button></div></div>
<div class="panel hide" id="tap"><div class="eyebrow">Sync your lyrics</div><div id="cur"></div><div id="nxt"></div>
  <button id="tapBtn">Tap when this line starts</button>
  <div class="row"><button class="alt" id="undo">Undo</button><button class="alt" id="fin">Finish</button></div></div>
<div class="panel hide" id="out"><div class="eyebrow">Timing export</div><h1 style="font-size:30px">Your timings</h1>
  <textarea id="res" readonly></textarea><div class="row"><button id="prev">Preview</button><button class="alt" id="copy">Copy</button></div></div>

<script>
/* ===== EDIT ONLY THIS BLOCK ===== */

const VIDEO_ID = "YOUR_VIDEO_ID"; // Used only if AUDIO_SRC is empty.
const AUDIO_SRC = "music.mp3";    // Keep this exact filename in your GitHub repository.
const LYRICS = [

  [215.85, ""]
];
/* ================================ */
const $=id=>document.getElementById(id);
$('title').textContent=TITLE.toUpperCase();document.title=TITLE+' • Cinematic Lyrics';
let LY=LYRICS.slice(),player,ready=false,audio;
if(AUDIO_SRC){audio=new Audio(AUDIO_SRC);audio.preload='auto';ready=true}
else{const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{videoId:VIDEO_ID,width:200,height:200,playerVars:{playsinline:1,rel:0,controls:0,disablekb:1},events:{onReady:()=>ready=true}})}}
const T=()=>AUDIO_SRC?audio.currentTime:(ready&&player?.getCurrentTime?player.getCurrentTime():0);
function whenReady(f){ready?f():setTimeout(()=>whenReady(f),150)}
function playFrom0(){whenReady(()=>{if(AUDIO_SRC){audio.currentTime=0;audio.play().catch(()=>{})}else{player.seekTo(0,true);player.playVideo()}})}
function playNow(){whenReady(()=>AUDIO_SRC?audio.play().catch(()=>{}):player.playVideo())}
const fx=$('fx'),g=fx.getContext('2d');let W,H,dpr=1;
function rs(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;fx.width=W*dpr;fx.height=H*dpr;fx.style.width=W+'px';fx.style.height=H+'px';g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const hs=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
let scene=0,sceneT=0;
function tunnel(t){const cx=W/2,cy=H/2;g.lineCap='round';for(let n=0;n<180;n++){const a=hs(n)*6.283,r=.15+hs(n+9)*.9,z=(hs(n+3)+t*.16)%1,z0=Math.max(0,z-.045);
g.strokeStyle=n%5?`rgba(255,241,220,${z*.8})`:`rgba(255,85,40,${z})`;g.lineWidth=.5+z*2;
g.beginPath();g.moveTo(cx+Math.cos(a)*r*W*z0*z0*1.2,cy+Math.sin(a)*r*W*z0*z0*1.2);g.lineTo(cx+Math.cos(a)*r*W*z*z*1.2,cy+Math.sin(a)*r*W*z*z*1.2);g.stroke()}}
function aurora(t){g.globalCompositeOperation='screen';const hues=[10,345,24,200];for(let k=0;k<4;k++){const x=W*(.5+.42*Math.sin(t*.24+k*1.8)),y=H*(.5+.35*Math.cos(t*.2+k*1.5)),r=Math.max(W,H)*.72,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`hsla(${hues[k]},95%,45%,.2)`);gr.addColorStop(1,'transparent');g.fillStyle=gr;g.fillRect(0,0,W,H)}g.globalCompositeOperation='source-over'}
function sungrid(t){const hz=H*.56,cx=W/2,r=Math.min(W,H)*.28,gr=g.createLinearGradient(0,hz-r,0,hz+r);gr.addColorStop(0,'#ff7a39');gr.addColorStop(1,'#8d1b20');g.globalAlpha=.65;g.fillStyle=gr;g.beginPath();g.arc(cx,hz-r*.25,r,0,Math.PI*2);g.fill();g.globalAlpha=1;g.strokeStyle='rgba(255,85,40,.45)';g.lineWidth=1;for(let i=0;i<14;i++){const p=((i+(t*.5)%1)/14),y=hz+(H-hz)*p*p;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}for(let i=-10;i<=10;i++){g.beginPath();g.moveTo(cx+i*W*.02,hz);g.lineTo(cx+i*W*.28,H);g.stroke()}}
function orbit(t){const cx=W/2,cy=H/2;for(let k=0;k<8;k++){const rx=W*(.12+k*.07),ry=rx*(.32+.1*Math.sin(t*.7+k));g.strokeStyle=k%2?'rgba(255,241,220,.22)':'rgba(255,85,40,.5)';g.lineWidth=k%2?1:2;g.beginPath();g.ellipse(cx,cy,rx,ry,t*.15*(k%2?1:-1)+k*.4,0,Math.PI*2);g.stroke()}}
const SC=[tunnel,aurora,sungrid,orbit];
function drawFx(now){g.fillStyle='#08090d';g.fillRect(0,0,W,H);SC[scene](now/1000);const f=1-cl((now-sceneT)/1000);if(f>0){g.fillStyle=`rgba(8,9,13,${f*.7})`;g.fillRect(0,0,W,H)}}
const stage=$('stage');let cur=-2,prevEl=null;
function show(i){if(prevEl){const o=prevEl;o.classList.remove('in');o.classList.add('out');setTimeout(()=>o.remove(),480);prevEl=null}
const text=i>=0?LY[i]?.[1]:'';if(!text)return;scene=i%SC.length;sceneT=performance.now();
const d=document.createElement('div');d.className='line';text.split(/\s+/).forEach((w,k)=>{const s=document.createElement('span');s.className='w';s.textContent=w;s.style.setProperty('--i',k);s.style.setProperty('--ry',((i+k)%2?-1:1)*48+'deg');d.appendChild(s)});
stage.appendChild(d);void d.offsetWidth;d.classList.add('in');prevEl=d}
const tilt={x:0,y:0};addEventListener('pointermove',e=>{tilt.y=(e.clientX/innerWidth-.5)*8;tilt.x=-(e.clientY/innerHeight-.5)*5});
function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(now){if(ready){const t=T();let i=-1;for(let k=0;k<LY.length;k++){if(LY[k][0]-.15<=t)i=k;else break}if(i!==cur){cur=i;show(i)}
const end=LY.length?LY[LY.length-1][0]:1;$('progress').style.width=(cl(t/end)*100)+'%';$('time').textContent=fmt(t)}
drawFx(now);stage.style.transform=`rotateX(${Math.sin(now/2500)*1.5+tilt.x}deg) rotateY(${Math.cos(now/3000)*2+tilt.y}deg)`;requestAnimationFrame(tick)}
requestAnimationFrame(tick);
const P=['go','ed','tap','out'];const open=n=>P.forEach(p=>$(p).classList.toggle('hide',p!==n));
$('start').onclick=()=>{open(null);playNow()};
$('sync').onclick=()=>{$('txt').value=LY.map(l=>l[1]).filter(Boolean).join('\n');open('ed')};
$('edBack').onclick=()=>open('go');
let lines=[],stamps=[],idx=0;const OFFSET=.15;
function paint(){$('cur').textContent=lines[idx]||'All lines tapped';$('nxt').textContent=idx+1<lines.length?'NEXT · '+lines[idx+1]:(idx<lines.length?'LAST LINE':'')}
$('edGo').onclick=()=>{lines=$('txt').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!lines.length)return;stamps=[];idx=0;paint();open('tap');playFrom0()};
$('tapBtn').onclick=()=>{if(idx>=lines.length)return;stamps.push(Math.max(0,+(T()-OFFSET).toFixed(2)));idx++;paint();if(idx>=lines.length)finish()};
$('undo').onclick=()=>{if(idx>0){idx--;stamps.pop();paint()}};
$('fin').onclick=()=>finish();
function finish(){const out=lines.slice(0,stamps.length).map((l,i)=>`  [${stamps[i]}, ${JSON.stringify(l)}]`);out.push(`  [${+(T()+1).toFixed(2)}, ""]`);$('res').value='const LYRICS = [\n'+out.join(',\n')+'\n];';open('out')}
$('copy').onclick=()=>{$('res').select();try{navigator.clipboard.writeText($('res').value)}catch(e){document.execCommand('copy')}};
$('prev').onclick=()=>{try{LY=new Function($('res').value+';return LYRICS')()}catch(e){return}cur=-2;open(null);playFrom0()};
</script>
