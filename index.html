<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Song</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+Devanagari:wght@800&family=Noto+Nastaliq+Urdu:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0d0b;--bone:#ece6d6;--sig:#ff4d1a;--ext:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;
  font-family:'Archivo Black','Noto Sans Devanagari','Noto Nastaliq Urdu',Impact,sans-serif}
#fx{position:fixed;inset:0;width:100%;height:100%}
.shade{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(13,13,11,.15),rgba(13,13,11,.75))}
#view{position:fixed;inset:0;perspective:1100px}
#stage{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.line{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:.15em .35em;padding:0 7vw;text-align:center;font-size:clamp(34px,10vw,96px);line-height:1.25;transform-style:preserve-3d}
.w{display:inline-block;opacity:0;text-shadow:var(--ext);
  transform:translate3d(0,40px,-900px) rotateY(var(--ry)) rotateX(45deg);
  transition:transform .9s cubic-bezier(.2,.9,.2,1),opacity .5s;transition-delay:calc(var(--i)*90ms)}
.line.in .w{opacity:1;transform:none}
.line.out .w{opacity:0;transform:translate3d(0,-70px,500px) rotateX(-35deg);transition:.6s;transition-delay:0s}
#yt{position:fixed;left:0;top:0;width:200px;height:200px;opacity:.01;pointer-events:none;z-index:-1}
.panel{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:var(--ink);padding:env(safe-area-inset-top,0px) 6vw env(safe-area-inset-bottom,0px)}
.panel.hide{display:none}
.panel h1{margin:0;font-size:clamp(34px,9vw,80px);text-align:center}
button{font:inherit;font-size:18px;background:var(--sig);color:#fff;border:0;padding:14px 28px;border-radius:8px}
button.alt{background:#2a2a26;color:var(--bone)}
textarea{width:100%;max-width:560px;height:42vh;background:#1b1a17;color:var(--bone);border:1px solid #3a3730;border-radius:8px;padding:12px;font:16px/1.5 monospace}
#cur{font-size:clamp(28px,8vw,64px);text-align:center;min-height:2.6em}
#nxt{opacity:.55;font:16px monospace;text-align:center}
#tapBtn{width:100%;max-width:560px;height:30vh;font-size:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<canvas id="fx"></canvas><div class="shade"></div>
<div id="view"><div id="stage"></div></div>
<div id="yt"><div id="player"></div></div>

<div class="panel" id="go"><h1 id="title">My Song</h1>
  <div class="row"><button id="start">Play</button><button class="alt" id="sync">Set timings</button></div></div>

<div class="panel hide" id="ed"><h1 style="font-size:28px">Paste lyrics</h1>
  <textarea id="txt" placeholder="One line per row"></textarea>
  <div class="row"><button id="edGo">Start tapping</button><button class="alt" id="edBack">Back</button></div></div>

<div class="panel hide" id="tap"><div id="cur"></div><div id="nxt"></div>
  <button id="tapBtn">TAP when this line starts</button>
  <div class="row"><button class="alt" id="undo">Undo</button><button class="alt" id="fin">Finish</button></div></div>

<div class="panel hide" id="out"><h1 style="font-size:28px">Your timings</h1>
  <textarea id="res" readonly></textarea>
  <div class="row"><button id="prev">Preview</button><button class="alt" id="copy">Copy</button></div></div>

<script>
/* ===== EDIT ONLY THIS BLOCK ===== */
const TITLE = "Safar";
const VIDEO_ID = "YOUR_VIDEO_ID";   // youtube.com/watch?v=THIS_PART
const AUDIO_SRC = "song.mp3";       // your mp3, uploaded to the repo with this exact name
const LYRICS = [                    // [seconds, "line"]  - use "Set timings" to generate
  [18.8, "O sanam, o jigar, tumko ho kya hi khabar"],
  [23.46, "Kaise kati ye raatein hain"],
  [27.95, "Kehte hain sab magar, koi chala na in par"],
  [32.56, "Raaste jo maine naape hain"],
  [36.97, "Kabhi hai taaron ki jhilmil"],
  [39.17, "Kabhi na dikhti manzil"],
  [41.85, "Aisa safar mera"],
  [46.08, "Main bhaaga-bhaaga, sadiyon se jaaga"],
  [50.77, "Aaya hoon meelon gaaon se"],
  [55.28, "Na humsafar koi, na apna ghar, yaara"],
  [59.83, "Rehta hoon behti naavon pe"],
  [74.23, "Dikhte hain khwaab jo jaagti aankhon ko"],
  [78.68, "Sapne nahi, iraade hain"],
  [83.36, "Poore woh karne ko chal pade nange pairon"],
  [87.93, "Khud se kiye jo waade hain"],
  [92.28, "Rukna na kabhi bhi tha hal"],
  [94.43, "Chalna hi toh hai manzil"],
  [96.96, "Main na kahin thehra"],
  [101.41, "Main bhaaga-bhaaga, sadiyon se jaaga"],
  [106.17, "Aaya hoon meelon gaaon se"],
  [110.64, "Na humsafar koi, na apna ghar, yaara"],
  [115.27, "Rehta hoon behti naavon pe"],
  [120.07, "Main bhaaga-bhaaga, sadiyon se jaaga"],
  [124.42, "Aaya hoon meelon karke iraada"],
  [129.19, "Main bhaaga-bhaaga, sadiyon se jaaga"],
  [133.74, "Aaya hoon meelon karke iraada"],
  [138.73, "Safar likha haath ki lakeeron mein"],
  [140.98, "Na khone diya khwaabon ko tabeeron mein"],
  [143.22, "Shehar ki hawa ne mujh mein rang bhare"],
  [145.63, "Main bhola sa puraani tasveeron mein"],
  [147.84, "Safar likha haath ki lakeeron mein"],
  [150.33, "Na khone diya khwaabon ko tabeeron mein"],
  [152.49, "Dekh ke Rab ne azm, mujhe par diye"],
  [154.89, "Ke ud sakoon buland taqdeeron se"],
  [157.19, "Safar likha haath ki lakeeron mein"],
  [159.56, "Na khone diya khwaabon ko tabeeron mein"],
  [161.66, "Shehar ki hawa ne mujh mein rang bhare"],
  [164.14, "Main bhola sa puraani tasveeron mein"],
  [166.55, "Safar likha haath ki lakeeron mein"],
  [168.74, "Na khone diya khwaabon ko tabeeron mein"],
  [170.73, "Dekh ke Rab ne azm, mujhe par diye"],
  [173.38, "Ke ud sakoon buland taqdeeron se"],
  [175.69, "Safar likha haath ki lakeeron mein"],
  [177.9, "Na khone diya khwaabon ko tabeeron mein"],
  [180.35, "Shehar ki hawa ne mujh mein rang bhare"],
  [182.51, "Main bhola sa puraani tasveeron mein"],
  [184.97, "Safar likha haath ki lakeeron mein"],
  [187.37, "Na khone diya khwaabon ko tabeeron mein"],
  [189.47, "Dekh ke Rab ne azm, mujhe par diye"],
  [191.98, "Ke ud sakoon buland taqdeeron se"],
  [194.13, "Safar likha haath ki lakeeron mein"],
  [196.51, "Na khone diya khwaabon ko tabeeron mein"],
  [198.83, "Shehar ki hawa ne mujh mein rang bhare"],
  [201.11, "Main bhola sa puraani tasveeron mein"],
  [203.42, "Safar likha haath ki lakeeron mein"],
  [205.64, "Na khone diya khwaabon ko tabeeron mein"],
  [207.84, "Dekh ke Rab ne azm, mujhe par diye"],
  [210.35, "Ke ud sakoon buland taqdeeron se"],
  [215.85, ""]
];
/* ================================ */
const $=id=>document.getElementById(id);
$('title').textContent=TITLE; document.title=TITLE;
let LY=LYRICS.slice();
let ext=[]; for(let i=1;i<=14;i++) ext.push(`${i}px ${i}px 0 hsl(14 85% ${42-i*2.4}%)`);
ext.push('0 0 40px rgba(255,77,26,.45)'); document.documentElement.style.setProperty('--ext',ext.join(','));

/* ---- audio source (YouTube hidden, or mp3) ---- */
let player,ready=false,audio;
if(AUDIO_SRC){audio=new Audio(AUDIO_SRC);ready=true}
else{
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
  window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{videoId:VIDEO_ID,width:200,height:200,
    playerVars:{playsinline:1,rel:0,controls:0,disablekb:1},events:{onReady:()=>ready=true}})};
}
const T=()=>AUDIO_SRC?audio.currentTime:(ready&&player.getCurrentTime?player.getCurrentTime():0);
function whenReady(f){ready?f():setTimeout(()=>whenReady(f),150)}
function playFrom0(){whenReady(()=>{if(AUDIO_SRC){audio.currentTime=0;audio.play()}else{player.seekTo(0,true);player.playVideo()}})}
function playNow(){whenReady(()=>AUDIO_SRC?audio.play():player.playVideo())}

/* ---- generated backgrounds ---- */
const fx=$('fx'),g=fx.getContext('2d');let W,H;
function rs(){const d=Math.min(devicePixelRatio||1,1.5);W=fx.width=innerWidth*d;H=fx.height=innerHeight*d}
addEventListener('resize',rs);rs();
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const hs=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
function sc0(t){ // star tunnel
  const cx=W/2,cy=H/2;g.lineCap='round';
  for(let n=0;n<260;n++){
    const a=hs(n)*6.283,r=.15+hs(n+9)*.9,z=(hs(n+3)+t*.16)%1,z0=Math.max(0,z-.04);
    const x1=cx+Math.cos(a)*r*W*z*z*1.3,y1=cy+Math.sin(a)*r*W*z*z*1.3;
    const x0=cx+Math.cos(a)*r*W*z0*z0*1.3,y0=cy+Math.sin(a)*r*W*z0*z0*1.3;
    g.strokeStyle=n%5?`rgba(236,230,214,${z})`:`rgba(255,77,26,${z})`;g.lineWidth=1+z*3;
    g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
  }
}
function sc1(t){ // aurora
  g.globalCompositeOperation='lighter';
  const hu=[14,330,190,30,280];
  for(let k=0;k<5;k++){
    const x=W*(.5+.4*Math.sin(t*.3+k*2)),y=H*(.5+.35*Math.cos(t*.23+k*1.7)),r=W*.75;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`hsla(${hu[k]},90%,50%,.38)`);gr.addColorStop(1,'transparent');
    g.fillStyle=gr;g.fillRect(0,0,W,H);
  }
  g.globalCompositeOperation='source-over';
}
function sc2(t){ // sun + grid floor
  const hz=H*.55,cx=W/2,r=W*.3;
  const gr=g.createLinearGradient(0,hz-r*1.6,0,hz);gr.addColorStop(0,'#ff4d1a');gr.addColorStop(1,'#8a1f5c');
  g.fillStyle=gr;g.beginPath();g.arc(cx,hz-r*.4,r,0,6.283);g.fill();
  g.fillStyle='#0d0d0b';g.fillRect(0,hz,W,H-hz);
  g.strokeStyle='rgba(255,77,26,.7)';g.lineWidth=2;
  const m=(t*.4)%1;
  for(let i=0;i<14;i++){const p=((i+m)/14),y=hz+(H-hz)*p*p;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  for(let i=-12;i<=12;i++){g.beginPath();g.moveTo(cx+i*W*.02,hz);g.lineTo(cx+i*W*.28,H);g.stroke()}
}
function sc3(t){ // orbit rings
  const cx=W/2,cy=H/2;
  for(let k=0;k<9;k++){
    const rx=W*(.1+k*.065),ry=rx*(.35+.12*Math.sin(t*.8+k));
    g.strokeStyle=k%2?'rgba(236,230,214,.35)':'rgba(255,77,26,.8)';g.lineWidth=k%2?2:4;
    g.beginPath();g.ellipse(cx,cy,rx,ry,t*.2*(k%2?1:-1)+k*.4,0,6.283);g.stroke();
  }
  g.fillStyle='#ece6d6';
  for(let n=0;n<70;n++){const a=t*(.2+hs(n)*.5)+n,rr=W*(.1+hs(n+5)*.55);
    g.beginPath();g.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.5,2+hs(n+2)*3,0,6.283);g.fill()}
}
const SC=[sc0,sc1,sc2,sc3];let scene=0,sceneT=0;
function drawFx(now){
  const t=now/1000;g.fillStyle='#0d0d0b';g.fillRect(0,0,W,H);SC[scene](t);
  const f=1-cl((now-sceneT)/900);if(f>0){g.fillStyle=`rgba(13,13,11,${f})`;g.fillRect(0,0,W,H)}
}

/* ---- 3D lyrics ---- */
const stage=$('stage');let cur=-2,prevEl=null;
function show(i){
  if(prevEl){const o=prevEl;o.classList.remove('in');o.classList.add('out');setTimeout(()=>o.remove(),700);prevEl=null}
  const text=i>=0?LY[i][1]:'';if(!text)return;
  scene=i%4;sceneT=performance.now();
  const d=document.createElement('div');d.className='line';
  text.split(/\s+/).forEach((w,k)=>{const s=document.createElement('span');s.className='w';s.textContent=w;
    s.style.setProperty('--i',k);s.style.setProperty('--ry',((i+k)%2?-1:1)*55+'deg');d.appendChild(s)});
  stage.appendChild(d);void d.offsetWidth;d.classList.add('in');prevEl=d;
}
const tilt={x:0,y:0};
addEventListener('pointermove',e=>{tilt.y=(e.clientX/innerWidth-.5)*14;tilt.x=-(e.clientY/innerHeight-.5)*10});
function tick(now){
  if(ready){const t=T();let i=-1;for(let k=0;k<LY.length;k++){if(LY[k][0]-.15<=t)i=k;else break}
    if(i!==cur){cur=i;show(i)}}
  drawFx(now);
  stage.style.transform=`rotateX(${Math.sin(now/2300)*3+tilt.x}deg) rotateY(${Math.cos(now/2900)*5+tilt.y}deg)`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---- UI ---- */
const P=['go','ed','tap','out'];const open=n=>P.forEach(p=>$(p).classList.toggle('hide',p!==n));
$('start').onclick=()=>{open(null);playNow()};
$('sync').onclick=()=>{$('txt').value=LY.map(l=>l[1]).filter(Boolean).join('\n');open('ed')};
$('edBack').onclick=()=>open('go');
let lines=[],stamps=[],idx=0;
const OFFSET=.15; // reaction-time compensation (s)
function paint(){$('cur').textContent=lines[idx]||'';$('nxt').textContent=idx+1<lines.length?'next: '+lines[idx+1]:(idx<lines.length?'last line':'')}
$('edGo').onclick=()=>{lines=$('txt').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length)return;stamps=[];idx=0;paint();open('tap');playFrom0()};
$('tapBtn').onclick=()=>{if(idx>=lines.length)return;stamps.push(Math.max(0,+(T()-OFFSET).toFixed(2)));idx++;paint();if(idx>=lines.length)finish()};
$('undo').onclick=()=>{if(idx>0){idx--;stamps.pop();paint()}};
$('fin').onclick=()=>finish();
function finish(){
  const out=lines.slice(0,stamps.length).map((l,i)=>`  [${stamps[i]}, ${JSON.stringify(l)}]`);
  out.push(`  [${+(T()+1).toFixed(2)}, ""]`);
  $('res').value='const LYRICS = [\n'+out.join(',\n')+'\n];';open('out');
}
$('copy').onclick=()=>{$('res').select();try{navigator.clipboard.writeText($('res').value)}catch(e){document.execCommand('copy')}};
$('prev').onclick=()=>{try{LY=new Function($('res').value+';return LYRICS')()}catch(e){return}cur=-2;open(null);playFrom0()};
</script>
</body>
</html>
